name: deploy

# One linear pipeline: shadow-gate migrations -> apply -> build -> ship.
# Migrations run every deploy (db push is idempotent; no-op when none are new),
# so code can never go live before the schema it depends on.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate:
    # Replays ALL migrations from zero on a throwaway local stack and runs the
    # test suite (incl. RLS forbidden-read tests). Only on green does anything
    # touch the real project.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # must match the droplet's Node
      - uses: supabase/setup-cli@v1
        with:
          version: latest # pin to the exact version after the first green run
      - name: Authenticate GitHub Packages
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "${{ secrets.GH_PACKAGES_TOKEN }}"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Shadow stack + replay migrations
        run: |
          supabase start
          supabase db reset
      - name: Tests against shadow stack
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)"
          export NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          pnpm test
      - name: Apply to client project
        if: vars.CLIENT_SLUG != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: migrate
    if: vars.CLIENT_SLUG != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate GitHub Packages
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "${{ secrets.GH_PACKAGES_TOKEN }}"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (Next standalone)
        run: |
          pnpm build
          # Standalone bundle expects static assets and public/ alongside it.
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
      - name: Ship release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SLUG: ${{ vars.CLIENT_SLUG }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            .next/standalone/ "$SLUG@$HOST:/srv/$SLUG/releases/$GITHUB_SHA/"
      - name: Activate, health-check, prune (auto-rollback on failure)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SLUG: ${{ vars.CLIENT_SLUG }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SLUG@$HOST" "
            set -e
            prev=\$(readlink /srv/$SLUG/current || true)
            ln -sfn /srv/$SLUG/releases/$GITHUB_SHA /srv/$SLUG/current
            sudo systemctl restart bcns-app@$SLUG
            sleep 5
            port=\$(grep '^PORT=' /srv/$SLUG/env | cut -d= -f2)
            if ! curl -sf \"http://localhost:\$port/api/health\"; then
              echo 'health check failed — rolling back' >&2
              if [ -n \"\$prev\" ]; then
                ln -sfn \"\$prev\" /srv/$SLUG/current
                sudo systemctl restart bcns-app@$SLUG
              fi
              exit 1
            fi
            # Prune old releases, never the one 'current' points at.
            cur=\$(readlink /srv/$SLUG/current)
            ls -dt /srv/$SLUG/releases/*/ | sed 's:/\$::' | grep -vx \"\$cur\" | tail -n +5 | xargs -r rm -rf
          "
